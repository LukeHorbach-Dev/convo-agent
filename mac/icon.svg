<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1838"/><stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <radialGradient id="gv" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.75"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gc" cx="0.95" cy="1.0" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#gv)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#gc)"/>
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- the mark: a speech bubble drawn as a C, with the conversation's dot in its opening -->
  <g transform="translate(0 -6)">
    <path d="M 688 660 A 232 232 0 1 1 688 364" fill="none" stroke="url(#ring)" stroke-width="94" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
    <path d="M 328 624 C 326 700 296 756 242 792 C 336 806 422 778 468 726 Z" fill="url(#ring)"/>
    <path d="M 688 660 A 232 232 0 1 1 688 364" fill="none" stroke="url(#ring)" stroke-width="94" stroke-linecap="round"/>
    <circle cx="734" cy="512" r="56" fill="#22d3ee" filter="url(#glow)" opacity="0.8"/>
    <circle cx="734" cy="512" r="52" fill="#e0fbff"/>
  </g>

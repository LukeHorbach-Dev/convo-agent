<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Convo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%230f766e'/%3E%3Crect x='14' y='22' width='32' height='22' rx='10' fill='%23fff7ec'/%3E%3Ccircle cx='23' cy='33' r='2.6' fill='%230f766e'/%3E%3Ccircle cx='30' cy='33' r='2.6' fill='%230f766e'/%3E%3Ccircle cx='37' cy='33' r='2.6' fill='%230f766e'/%3E%3C/svg%3E">
<style>
/* ============================================================== design tokens */
:root {
  --bg: #f5f3ee; --bg-2: #efece5; --surface: #ffffff; --raised: #ffffff; --sunk: #f1eee8;
  --ink: #12201e; --ink-2: #33433f; --muted: #5d6d69; --faint: #8a9894; --line: #e4dfd5; --line-2: #d6d0c4;
  --accent: #0f766e; --accent-2: #0b5f58; --accent-soft: #dcf2ec; --accent-ink: #ffffff;
  --mint: #a7f3d0; --go: #16794c; --go-soft: #dff3e8; --warn: #9a5a06; --warn-soft: #fbefd9;
  --bad: #b8322a; --bad-soft: #fbe5e2; --go-ink: #ffffff; --bad-ink: #ffffff; --info: #2f5fb3; --info-soft: #e5edfb;
  --them: #efece6; --me: #d9f1ea; --me-ink: #0b3d38;
  --shadow-1: 0 1px 2px rgba(18, 32, 30, .06), 0 1px 1px rgba(18, 32, 30, .04);
  --shadow-2: 0 10px 30px -12px rgba(18, 32, 30, .25), 0 2px 6px rgba(18, 32, 30, .06);
  --shadow-3: 0 24px 60px -20px rgba(10, 30, 28, .45);
  --radius: 18px; --radius-s: 12px; --radius-xs: 8px;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --size: 17px; --lh: 1.6; --track: 0;
  --sidebar: 248px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="dark"] {
  --bg: #0c1514; --bg-2: #101c1a; --surface: #14211f; --raised: #182725; --sunk: #0f1a19;
  --ink: #e6efec; --ink-2: #c3d2ce; --muted: #9aaea9; --faint: #6f8580; --line: #233431; --line-2: #2e4440;
  --accent: #5eead4; --accent-2: #99f6e4; --accent-soft: #123a35; --accent-ink: #04201d;
  --mint: #1f5e52; --go: #4ade80; --go-soft: #12301f; --warn: #fbbf24; --warn-soft: #33270c;
  --bad: #fb8b80; --bad-soft: #3a1714; --go-ink: #04210f; --bad-ink: #2a0705; --info: #93b4f5; --info-soft: #172640;
  --them: #1d2c2a; --me: #134a43; --me-ink: #d7fbf3;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px -12px rgba(0, 0, 0, .7); --shadow-3: 0 24px 60px -18px rgba(0, 0, 0, .8);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1514; --bg-2: #101c1a; --surface: #14211f; --raised: #182725; --sunk: #0f1a19;
  --ink: #e6efec; --ink-2: #c3d2ce; --muted: #9aaea9; --faint: #6f8580; --line: #233431; --line-2: #2e4440;
  --accent: #5eead4; --accent-2: #99f6e4; --accent-soft: #123a35; --accent-ink: #04201d;
  --mint: #1f5e52; --go: #4ade80; --go-soft: #12301f; --warn: #fbbf24; --warn-soft: #33270c;
  --bad: #fb8b80; --bad-soft: #3a1714; --go-ink: #04210f; --bad-ink: #2a0705; --info: #93b4f5; --info-soft: #172640;
  --them: #1d2c2a; --me: #134a43; --me-ink: #d7fbf3;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px -12px rgba(0, 0, 0, .7); --shadow-3: 0 24px 60px -18px rgba(0, 0, 0, .8);
} }
:root.easy { --font: Verdana, "Trebuchet MS", Tahoma, sans-serif; --font-display: Verdana, Tahoma, sans-serif; --lh: 1.75; --track: .015em; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============================================================== base */
* { box-sizing: border-box; }
html { font-size: var(--size); background: var(--bg); }
body { margin: 0; font: 400 1rem/var(--lh) var(--font); letter-spacing: var(--track); color: var(--ink); background: var(--bg);
       -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.01em; line-height: 1.25; margin: 0; }
h1 { font-size: 1.65rem; font-weight: 700; } h2 { font-size: 1.15rem; font-weight: 650; } h3 { font-size: 1rem; font-weight: 650; }
p { margin: .35em 0; } small, .small { font-size: .84rem; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }

/* ============================================================== shell */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;
        background: linear-gradient(180deg, var(--bg-2), var(--bg)); border-right: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 11px; padding: 4px 10px 18px; }
.logo-mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
             background: linear-gradient(140deg, #0b3d3a, #2dbe96); box-shadow: var(--shadow-1); }
.logo-mark i { display: flex; gap: 3px; background: #fff7ec; padding: 6px 7px; border-radius: 9px; }
.logo-mark i b { width: 4px; height: 4px; border-radius: 50%; background: #0f766e; }
.logo strong { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: -.02em; }
.logo > div { min-width: 0; }
.logo span { display: block; font-size: .74rem; color: var(--muted); margin-top: -3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo span span { display: inline; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; cursor: pointer;
              padding: 10px 12px; border-radius: 12px; color: var(--ink-2); font-weight: 560; text-align: left; transition: background .15s var(--ease); }
.nav button:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.nav button[aria-current="page"] svg.i { color: var(--accent); }
.nav .count { margin-left: auto; min-width: 1.6em; padding: 0 .5em; border-radius: 99px; font-size: .74rem; font-weight: 700;
              line-height: 1.6em; text-align: center; background: var(--accent); color: var(--accent-ink); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 8px 4px 0; }
.status { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface);
          border: 1px solid var(--line); font-size: .85rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.go { background: var(--go); box-shadow: 0 0 0 4px color-mix(in srgb, var(--go) 18%, transparent); animation: pulse 1.6s infinite; }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--go) 5%, transparent); } }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 32px;
       background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px);
       border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top h1 { font-size: 1.25rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.askbar { display: flex; align-items: center; gap: 8px; width: min(360px, 38vw); padding: 8px 12px; border-radius: 12px;
          border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: text; }
.askbar kbd { margin-left: auto; font: 600 .72rem var(--font); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
.content { padding: 26px 32px 80px; max-width: 1080px; width: 100%; }
.page { animation: rise .35s var(--ease); } @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.practice-band { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 32px; font-size: .9rem;
                 background: repeating-linear-gradient(-45deg, var(--warn-soft), var(--warn-soft) 14px, color-mix(in srgb, var(--warn-soft) 70%, var(--bg)) 14px 28px);
                 border-bottom: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); color: var(--ink); }
.practice-band b { color: var(--warn); }

/* ============================================================== components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-1); }
.card + .card, .stack > * + * { margin-top: 14px; }
.grid-2 > *, .grid-3 > * { margin-top: 0 !important; }
.card.flat { box-shadow: none; } .card.sunk { background: var(--sunk); box-shadow: none; }
.section { margin-top: 30px; } .section > h2 { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; } .grow { flex: 1; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface);
       color: var(--ink); padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .92rem; white-space: nowrap;
       transition: transform .08s, background .15s, border-color .15s, box-shadow .15s; }
.btn:hover { border-color: var(--faint); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.go { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn.danger-soft { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.btn.big { padding: 13px 22px; font-size: 1rem; border-radius: 14px; } .btn.small { padding: 6px 11px; font-size: .84rem; border-radius: 10px; }
.btn.stop { background: #c2372d; border-color: #c2372d; color: #fff; box-shadow: 0 6px 16px -8px #c2372d; }
.btn.stop:hover { filter: brightness(1.06); }
.field { width: 100%; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--raised); color: var(--ink);
         transition: border-color .15s, box-shadow .15s; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
textarea.field { resize: vertical; line-height: 1.55; }
select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
               background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: .84rem; margin-top: 6px; }
.setting { display: grid; grid-template-columns: 1fr minmax(160px, 260px); gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.setting:first-child { border-top: 0; padding-top: 0; } .setting:last-child { padding-bottom: 0; }
.toggle { position: relative; width: 48px; height: 28px; flex: none; }
.toggle input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .2s var(--ease); }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
                      box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--ease); }
.toggle input:checked + span { background: var(--accent); } .toggle input:checked + span::after { transform: translateX(20px); }
.toggle input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line-2); background: var(--surface); padding: 6px 13px; border-radius: 99px; cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill .n { opacity: .65; margin-left: 4px; font-weight: 700; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 99px;
       background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.go { background: var(--go-soft); color: var(--go); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.info { background: var(--info-soft); color: var(--info); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 13px; border-radius: 12px; font-size: .9rem; background: var(--warn-soft); color: var(--ink); }
.note svg.i { color: var(--warn); margin-top: .2em; } .note.bad { background: var(--bad-soft); } .note.bad svg.i { color: var(--bad); }
.note.info { background: var(--info-soft); } .note.info svg.i { color: var(--info); }
.avatar { --h: 170; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: .95rem;
          background: hsl(var(--h) 55% 88%); color: hsl(var(--h) 45% 28%); }
:root[data-theme="dark"] .avatar { background: hsl(var(--h) 30% 24%); color: hsl(var(--h) 60% 82%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar { background: hsl(var(--h) 30% 24%); color: hsl(var(--h) 60% 82%); } }
.avatar.big { width: 58px; height: 58px; font-size: 1.25rem; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who .name { font-weight: 650; } .who .handle { color: var(--muted); font-size: .88rem; }
.progress { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--mint)); transition: width .4s var(--ease); }
.progress.warn > i { background: var(--warn); } .progress.bad > i { background: var(--bad); }
.skeleton { border-radius: var(--radius); background: linear-gradient(90deg, var(--sunk), var(--bg-2), var(--sunk)); background-size: 300% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .art { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty .art svg.i { width: 30px; height: 30px; }
.empty b { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

/* ============================================================== today */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 28px 30px; color: #f1fffb;
        background: radial-gradient(120% 140% at 0% 0%, #1d8f7f 0%, #0d4f49 45%, #0a2f2c 100%); box-shadow: var(--shadow-2); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%;
               background: radial-gradient(circle, rgba(167, 243, 208, .35), transparent 65%); }
.hero.bad { background: radial-gradient(120% 140% at 0% 0%, #b6463c 0%, #6f211b 55%, #3c1210 100%); }
.hero.warn { background: radial-gradient(120% 140% at 0% 0%, #b7791f 0%, #6b430a 55%, #3a2405 100%); }
.hero small { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .75; font-size: .74rem; }
.hero h2 { font-size: 1.7rem; margin: 6px 0 6px; color: #fff; } .hero p { margin: 0; opacity: .9; max-width: 60ch; }
.hero .row { margin-top: 18px; position: relative; z-index: 1; }
.hero .btn { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(6px); }
.hero .btn:hover { background: rgba(255,255,255,.2); }
.hero .btn.light { background: #fff; color: #0b3d38; border-color: #fff; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-1); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.55rem; line-height: 1.15; letter-spacing: -.02em; }
.stat span { color: var(--muted); font-size: .82rem; }
.stat .progress { margin-top: 8px; height: 6px; }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: start; }
.num { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display);
       background: var(--accent-soft); color: var(--accent); }
.num.done { background: var(--go-soft); color: var(--go); } .num.now { background: var(--accent); color: var(--accent-ink); }
.live { display: grid; grid-template-columns: 1fr; gap: 10px; }
.live img { width: 100%; border-radius: 14px; border: 1px solid var(--line); background: var(--sunk); aspect-ratio: 16 / 10; object-fit: cover; }
.feed { display: grid; }
.feed > div { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); font-size: .92rem; align-items: start; }
.feed > div:first-child { border-top: 0; }
.feed .k { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); margin-top: 1px; }
.feed .good .k { background: var(--go-soft); color: var(--go); } .feed .warn .k { background: var(--warn-soft); color: var(--warn); }
.feed .problem .k { background: var(--bad-soft); color: var(--bad); }
.feed time { color: var(--faint); font-size: .8rem; white-space: nowrap; }
.peoplelist > button { display: flex; width: 100%; align-items: center; gap: 12px; text-align: left; border: 0; background: none; cursor: pointer;
                       padding: 10px 8px; border-radius: 12px; }
.peoplelist > button:hover { background: var(--sunk); }

/* ============================================================== messages */
.msg { padding: 0; overflow: hidden; }
.msg-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; }
.msg-body { padding: 10px 20px 18px; }
.msg-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--sunk) 60%, var(--surface)); }
.msg.approved { border-color: color-mix(in srgb, var(--go) 45%, var(--line)); }
.msg.look { border-left: 4px solid var(--warn); }
.chat { display: flex; flex-direction: column; gap: 5px; margin: 10px 0 4px; }
.bubble { max-width: 80%; padding: 8px 14px; border-radius: 20px; font-size: .95rem; line-height: 1.45; word-wrap: break-word; }
.bubble.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
.bubble time { display: block; font-size: .7rem; opacity: .55; margin-top: 2px; }
.draft { margin-top: 10px; border-radius: 18px; padding: 10px 14px 6px; background: var(--me); border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); }
.draft label { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.draft textarea { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 2.6em; outline: none; padding: 2px 0; color: var(--me-ink); line-height: 1.5; }
.translate { font-size: .86rem; color: var(--muted); margin-top: 6px; }
.media { display: inline; font-style: normal; } .media b { font-weight: 650; } .media span { color: var(--muted); }

/* ============================================================== people + drawer */
.plist { display: grid; }
.prow { display: grid; grid-template-columns: 26px 42px 1fr auto; gap: 12px; align-items: center; padding: 12px 6px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.prow .open { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; min-width: 0; }
.prow .sum { color: var(--muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(6, 18, 16, .38); backdrop-filter: blur(2px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; z-index: 61; width: min(560px, 100vw); background: var(--bg); box-shadow: var(--shadow-3);
          display: flex; flex-direction: column; animation: slide .28s var(--ease); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.drawer header { padding: 22px 24px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.drawer .body { padding: 18px 24px 40px; overflow-y: auto; flex: 1; }
.drawer .close { position: absolute; top: 16px; right: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .92rem; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
.report li { margin: 3px 0; } .report h3 { margin-top: 14px; font-size: .9rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* ============================================================== ask */
.ask-wrap { display: grid; grid-template-rows: 1fr auto; min-height: calc(100vh - 190px); }
.thread { display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; }
.say { max-width: 78%; padding: 12px 16px; border-radius: 20px; line-height: 1.5; }
.say.you { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.say.convo { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow-1); }
.say .meta { display: block; font-size: .74rem; opacity: .65; margin-top: 4px; }
.composer { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
.composer form { display: flex; gap: 10px; padding: 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-2); }
.composer input { flex: 1; border: 0; background: transparent; padding: 8px 10px; outline: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: .85rem; cursor: pointer; color: var(--ink-2); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.typing { display: inline-flex; gap: 4px; } .typing b { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: bob 1s infinite; }
.typing b:nth-child(2) { animation-delay: .15s; } .typing b:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 50% { transform: translateY(-4px); opacity: .5; } }

/* ============================================================== overlays */
.palette { position: fixed; z-index: 70; left: 50%; top: 14vh; transform: translateX(-50%); width: min(620px, calc(100vw - 32px));
           background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-3); border: 1px solid var(--line); overflow: hidden; animation: pop .2s var(--ease); }
@keyframes pop { from { transform: translateX(-50%) scale(.97); opacity: 0; } }
.palette form { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.palette input { flex: 1; border: 0; background: transparent; outline: none; font-size: 1.08rem; }
.palette .out { padding: 16px 20px; max-height: 50vh; overflow: auto; }
.modal { position: fixed; z-index: 80; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px));
         background: var(--surface); border-radius: 22px; padding: 24px; box-shadow: var(--shadow-3); animation: pop2 .2s var(--ease); }
@keyframes pop2 { from { transform: translate(-50%, -48%) scale(.98); opacity: 0; } }
.modal h2 { margin-bottom: 8px; } .modal .row { margin-top: 18px; justify-content: flex-end; }
.toasts { position: fixed; z-index: 90; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; width: min(520px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg);
         box-shadow: var(--shadow-3); font-size: .93rem; animation: rise .25s var(--ease); }
.toast.bad { background: #c2372d; color: #fff; }

#gate { max-width: 420px; margin: 16vh auto; text-align: center; }

/* ============================================================== small screens */
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 30; bottom: 0; top: auto; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px 8px;
          border-right: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px); }
  .logo, .nav-sep, .side-foot, .nav .label-long { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; overflow-x: auto; }
  .nav button { flex-direction: column; gap: 2px; padding: 6px 8px; font-size: .68rem; width: auto; }
  .nav button svg.i { width: 1.4em; height: 1.4em; }
  .nav .count { position: absolute; margin: -4px 0 0 18px; font-size: .62rem; }
  .nav .extra { display: none; }
  .top { padding: 12px 16px; } .askbar { display: none; }
  .content { padding: 18px 16px 110px; }
  .stats { grid-template-columns: 1fr 1fr; } .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .setting { grid-template-columns: 1fr; }
  .practice-band { padding: 10px 16px; }
}

<script>
'use strict';
/* ============================================================== plumbing */
if (location.hash.startsWith('#token=')) { sessionStorage.setItem('tok', decodeURIComponent(location.hash.slice(7))); history.replaceState(null, '', location.pathname + '#/today'); }
let TOKEN = sessionStorage.getItem('tok') || '', S = null, PAGE = null;
const prefs = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const icon = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const money = n => !n ? '$0.00' : n < 0.01 ? 'under 1¢' : '$' + n.toFixed(2);
const cents = n => n < 0.001 ? 'under 0.1¢' : n < 0.01 ? (n * 100).toFixed(1) + '¢' : n < 1 ? Math.round(n * 100) + '¢' : '$' + n.toFixed(2);
const hue = s => [...String(s || '?')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const initial = s => esc(((String(s || '?').replace(/[^\p{L}\p{N}]/gu, '')[0]) || '?').toUpperCase());
const avatar = (name, big) => `<span class="avatar${big ? ' big' : ''}" style="--h:${hue(name)}" aria-hidden="true">${initial(name)}</span>`;
function ago(iso) {
  if (!iso) return '';
  const t = typeof iso === 'number' ? iso : Date.parse(iso), s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return new Date(t).toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'});
}
const MEDIA = {'voice message': ['🎤', 'Voice message'], call: ['📞', 'Call'], photo: ['📷', 'Photo'], video: ['🎞️', 'Video'],
  gif: ['✨', 'GIF'], sticker: ['🙂', 'Sticker'], file: ['📎', 'File'], attachment: ['📎', 'Attachment'], reel: ['🎬', 'Reel'],
  post: ['🖼️', 'Post'], 'shared a post': ['🖼️', 'Post']};
/* Message text with Convo's tags ("[reel by @x: caption]", "[voice message]") shown as labels. */
const msgText = t => esc(t).replace(/\[(voice message|call|photo|video|gif|sticker|file|attachment|reel|post|shared a post)([^\]]*)\]/g,
  (all, k, rest) => `<span class="media">${MEDIA[k][0]} <b>${MEDIA[k][1]}</b>${rest.trim() ? ' <span>' + rest.trim() + '</span>' : ''}</span>`);
const clock = ms => new Date(ms).toLocaleString([], {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'X-Agent-Token': TOKEN, 'content-type': 'application/json', ...(opts.headers || {})}});
  if (r.status === 401) { sessionStorage.removeItem('tok'); gate(true); throw new Error('auth'); }
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) { const msg = (body && body.detail) || 'Something went wrong'; toast(msg, 'bad'); throw new Error(msg); }
  return body;
}
const post = (path, body) => api(path, {method: 'POST', body: JSON.stringify(body || {})}).then(r => { refresh(); return r; });

function toast(text, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
  el.innerHTML = icon(kind === 'bad' ? 'alert' : 'check') + `<span>${esc(text)}</span>`;
  $('#toasts').append(el); setTimeout(() => el.remove(), kind === 'bad' ? 7000 : 4200);
}
function closeOverlay() { $('#overlay').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function escClose(e) { if (e.key === 'Escape') closeOverlay(); }
function overlay(html, focus) { $('#overlay').innerHTML = html; document.addEventListener('keydown', escClose); setTimeout(() => { const f = focus && $(focus); f && f.focus(); }, 30); }
function confirmBox({title, text, ok = 'OK', danger = false, typed = null}) {
  return new Promise(res => {
    window.__res = v => { closeOverlay(); res(v); };
    overlay(`<div class="scrim" onclick="__res(false)"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h2 id="mt">${esc(title)}</h2><p class="muted">${esc(text)}</p>
      ${typed ? `<input id="typed" class="field" style="margin-top:12px" placeholder="Type ${esc(typed)}" autocomplete="off">` : ''}
      <div class="row"><button class="btn ghost" onclick="__res(false)">Cancel</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" id="okbtn" onclick="__res(${typed ? `$('#typed').value` : 'true'})">${esc(ok)}</button></div></div>`, typed ? '#typed' : '#okbtn');
  });
}
function gate(on) { $('#gate').hidden = !on; $('#app').hidden = on; }
function saveToken() { TOKEN = $('#tok').value.trim(); sessionStorage.setItem('tok', TOKEN); boot(); }

/* reading preferences */
function applyPrefs() {
  document.documentElement.style.setProperty('--size', prefs.get('sz', '17') + 'px');
  document.documentElement.classList.toggle('easy', prefs.get('easy', '') === '1');
  const th = prefs.get('theme', 'system');
  if (th === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = th;
}
applyPrefs();

/* ============================================================== routing */
const TITLES = {today: 'Today', replies: 'Replies', hellos: 'Hellos', people: 'People', ask: 'Ask Convo', activity: 'Activity',
                about: 'About me', settings: 'Settings', help: 'Help'};
const PAGES = {};
function go(page) { location.hash = '#/' + page; }
function route() {
  const page = (location.hash.match(/^#\/(\w+)/) || [])[1] || prefs.get('page', 'today');
  PAGE = TITLES[page] ? page : 'today'; prefs.set('page', PAGE);
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.page === PAGE ? 'page' : 'false'));
  $('#title').textContent = TITLES[PAGE];
  const c = $('#content'); c.innerHTML = `<div class="page" id="page-${PAGE}"></div>`;
  PAGES[PAGE].mount($('#page-' + PAGE));
  window.scrollTo(0, 0);
}
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
window.addEventListener('hashchange', () => { if (S) route(); });

/* ============================================================== state + chrome */
async function refresh() {
  S = await api('/api/state');
  $('#me').textContent = S.you;
  const c = S.counts, snd = S.sender;
  const cr = $('#c-replies'); cr.hidden = !c.replies_to_check; cr.textContent = c.replies_to_check;
  const ch = $('#c-hellos'); ch.hidden = !c.hellos_to_check; ch.textContent = c.hellos_to_check;
  let dot = '', line = 'Ready';
  if (snd.active) { dot = 'go'; line = snd.status; }
  else if (S.job.name) { dot = 'go'; line = cap(S.job.name) + '…'; }
  else if (snd.stopped) { dot = 'bad'; line = 'Stopped by you'; }
  else if (snd.status.startsWith('Stopped')) { dot = 'bad'; line = 'Stopped: needs you'; }
  else if (snd.waiting_until || snd.quiet_until) { dot = 'warn'; line = snd.status; }
  else if (S.overnight) { dot = 'go'; line = `Writing ${S.overnight.count} replies overnight`; }
  $('#dot').className = 'dot ' + dot; $('#statusline').textContent = line;
  $('#practiceband').hidden = !S.practice; $('#autosend').checked = !!S.auto_send;
  document.title = S.practice ? 'Convo · Practice' : (c.replies_to_check + c.hellos_to_check ? `Convo (${c.replies_to_check + c.hellos_to_check})` : 'Convo');
  PAGES[PAGE] && PAGES[PAGE].update && PAGES[PAGE].update();
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
async function stopNow() { await post('/api/stop'); toast('Stopped. Nothing else goes until you press Send.'); }
async function setAuto(on) {
  if (on && !await confirmBox({title: 'Automatic sending (practice)', text: 'In practice, replies and hellos will be approved and sent as soon as they are written. Your real Instagram is never touched.', ok: 'Turn on'})) { $('#autosend').checked = false; return; }
  await post('/api/settings', {auto_send: on});
}

        `<button onclick="openPerson('${esc(p.username)}')">${avatar(p.display_name || p.username)}<span class="grow"><b>@${esc(p.username)}</b><br><span class="muted small">${esc(p.interest_why || p.summary || '')}</span></span></button>`).join('')}</div>` : '<p class="muted">After replies are written, people you\'d get on with show up here.</p>'}</div>
      <div class="card"><h2 style="margin-bottom:8px">${icon('alert')} Worth a closer look</h2>${careful.length ? `<div class="peoplelist">${careful.map(p =>
        `<button onclick="openPerson('${esc(p.username)}')">${avatar(p.username)}<span class="grow"><b>@${esc(p.username)}</b><br><span class="muted small">${esc(p.concern_why || '')}</span></span></button>`).join('')}</div>` : '<p class="muted">Nothing worrying. Chats that need care show up here.</p>'}</div>`;

function feedHtml(items) {
  const ic = {good: 'check', warn: 'alert', problem: 'x', info: 'list'};
  return items.length ? items.map(a => `<div class="${esc(a.kind)}"><span class="k">${icon(ic[a.kind] || 'list')}</span><span>${esc(a.text)}</span><time>${esc(ago(a.at))}</time></div>`).join('')
    : '<p class="muted" style="padding:6px 2px">Nothing yet.</p>';
}
async function startSend(one) { await post('/api/send/start', {just_one: !!one}); toast(one ? 'Sending one. Check it in Instagram, then send the rest.' : 'Sending. You can use your laptop meanwhile.'); }
async function writeNow() {
  if (S.overnight && !await confirmBox({title: 'Write them now?', text: 'Writing straight away costs twice as much as overnight. The overnight ones are cancelled.', ok: 'Write now'})) return;
  await post('/api/think', {now: true}); toast('Writing replies…');
}
async function refreshLive() {
  if (!S || !S.sender.active || PAGE !== 'today' || document.hidden) return;
  const lv = await api('/api/live'); const img = $('#liveimg'); if (!img || !lv.image) return;
  img.src = 'data:image/png;base64,' + lv.image; $('#livenote').textContent = lv.status + (lv.note ? ' · ' + lv.note : '');

/* ============================================================== replies + hellos */
const EDITS = {};             // what Luke typed in a reply or hello box, kept if the list redraws before it's saved
document.addEventListener('input', e => { const m = e.target.id && e.target.id.match(/^t(\d+)$/); if (m) EDITS[m[1]] = e.target.value; });
const textOf = d => d.id in EDITS ? EDITS[d.id] : d.text;
const F = {reply: prefs.get('f-reply', 'draft'), hello: prefs.get('f-hello', 'draft'), people: 'following', sort: 'recent', q: ''};
function draftsPage(kind) {
  const isReply = kind === 'reply';
  const filters = isReply ? [['draft', 'To check'], ['look', 'Needs a look'], ['interesting', 'Interesting'], ['approved', 'Approved'], ['sent', 'Sent'], ['other', 'Skipped or unsure']]
                          : [['draft', 'To check'], ['approved', 'Approved'], ['sent', 'Sent'], ['skipped', 'Skipped']];
  let items = [], total = 0;
  const page = {
    mount(el) {
      el.innerHTML = `<div class="between"><p class="muted grow" style="max-width:62ch">${isReply ? 'Chats where they wrote last. Change the words if you like, then approve. The ones marked “needs a look” are for you to do one by one.'
          : 'People you follow and have never messaged. Each gets one of your own hellos. Right before sending, Claude checks the chat is still empty.'}</p>
        <button class="btn go" onclick="approveAll('${kind}')">${icon('check')} Approve all ready</button></div>
        <div id="banner"></div>
        <div class="pills" style="margin:14px 0" role="group" aria-label="Show">${filters.map(([v, l]) => `<button class="pill" data-v="${v}" aria-pressed="${F[kind] === v}">${esc(l)}</button>`).join('')}</div>
        <div id="list" class="stack"><div class="skeleton" style="height:160px"></div><div class="skeleton" style="height:160px"></div></div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="more" hidden>Show more</button></div>`;
      el.querySelectorAll('.pill').forEach(p => p.onclick = () => { F[kind] = p.dataset.v; prefs.set('f-' + kind, F[kind]); el.querySelectorAll('.pill').forEach(x => x.setAttribute('aria-pressed', x === p)); this.load(); });
      $('#more').onclick = () => this.load(true);
      this.load(); this.update();
    },
    update() {
      const b = $('#banner'); if (!b) return;
      b.innerHTML = isReply && S.overnight ? `<div class="note info" style="margin-top:14px">${icon('clock')}<span class="grow">${plural(S.overnight.count, 'reply is', 'replies are')} being written overnight at half price. They appear here when ready, usually within the hour.</span><button class="btn small" onclick="writeNow()">Write now</button></div>` : '';
    },
    async load(more) {
      const f = F[kind], status = {look: 'draft', interesting: 'draft'}[f] || f, only = {look: 'look', interesting: 'interesting'}[f] || '';
      const r = await api(`/api/drafts?kind=${kind}&status=${status}&only=${only}&offset=${more ? items.length : 0}&limit=40`);
      items = more ? items.concat(r.items) : r.items; total = r.total;
      const list = $('#list'); if (!list) return;
      list.innerHTML = items.length ? items.map(d => isReply ? replyCard(d) : helloCard(d)).join('') : emptyState(kind, f);
      $('#more').hidden = items.length >= total;
    },
  };
  return page;
}
function emptyState(kind, f) {
  const t = f === 'draft' ? (kind === 'reply' ? ['All caught up', 'Load a download and replies appear here.'] : ['No hellos waiting', 'Hellos appear after you load a download.'])
          : ['Nothing here', 'Try another filter.'];
  return `<div class="card empty"><div class="art">${icon(kind === 'reply' ? 'reply' : 'wave')}</div><b>${t[0]}</b>${t[1]}</div>`;
}
function draftButtons(d) {
  if (d.status === 'draft') return `<button class="btn go" onclick="act(${d.id}, 'approve')">${icon('check')} Approve</button><button class="btn ghost" onclick="act(${d.id}, 'skip')">Skip</button>`;
  if (d.status === 'approved') return `<span class="tag go">${icon('check')} Approved</span><button class="btn ghost small" onclick="act(${d.id}, 'unapprove')">Undo</button>`;
  if (d.status === 'sent') return `<span class="tag go">${icon('send')} Sent ${esc(ago(d.sent_at))}</span>`;
  if (d.status === 'sending') return `<span class="tag accent">Sending…</span>`;
  return `<span class="tag">${esc(d.status === 'unsure' ? 'Not sure it went' : d.status === 'failed' ? 'Couldn\'t send' : 'Skipped')}</span><button class="btn ghost small" onclick="act(${d.id}, 'restore')">Back to check</button>`;
}
function replyCard(d) {
  const c = d.context || {}, interest = c.interest ?? d.interest, concern = c.concern ?? d.concern, name = d.other_name || d.username || 'Someone';
  const look = c.needs_look || c.manual;
  const tags = [interest >= 3 ? `<span class="tag go">${icon('star')} You'd click</span>` : interest === 2 ? '<span class="tag go">Interesting</span>' : '',
    concern === 'high' ? '<span class="tag bad">Careful</span>' : concern === 'low' ? '<span class="tag warn">Have a look</span>' : '',
    c.direct ? '<span class="tag info">Your own</span>' : '', c.media && MEDIA[c.media] ? `<span class="tag info">${MEDIA[c.media][0]} ${esc(MEDIA[c.media][1])}</span>` : '', look && d.status === 'draft' ? '<span class="tag warn">Needs a look</span>' : ''].join('');
  const chat = (d.recent || []).map(m => `<div class="bubble ${m.from_me ? 'me' : 'them'}">${msgText(m.text)}<time>${esc(ago(m.at))}</time></div>`).join('');
  const foreign = c.language && c.language.toLowerCase() !== 'english';
  const editable = !['sent', 'sending'].includes(d.status);
  return `<article class="card msg ${d.status === 'approved' ? 'approved' : ''} ${look && d.status === 'draft' ? 'look' : ''}">
    <div class="msg-head">${avatar(name)}<div class="grow who" style="display:block"><span class="name">${esc(name)}</span>
      ${d.username ? `<button class="btn ghost small" style="padding:2px 6px" onclick="openPerson('${esc(d.username)}')">@${esc(d.username)}</button>` : ''}</div><div class="row" style="gap:6px">${tags}</div></div>
    <div class="msg-body">
      ${c.summary ? `<p class="muted small">${esc(c.summary)}${c.interest_why ? ' · ' + esc(c.interest_why) : ''}</p>` : ''}
      ${d.note ? `<div class="note" style="margin-top:8px">${icon('alert')}<span>${esc(d.note)}</span></div>` : ''}
      <div class="chat">${chat}</div>
      ${foreign && c.their_message_english ? `<p class="translate">In English: ${esc(c.their_message_english)}</p>` : ''}
      <div class="draft"><label for="t${d.id}">Your reply</label><textarea id="t${d.id}" rows="2" ${editable ? '' : 'readonly'} placeholder="Type your reply" onchange="saveText(${d.id})">${esc(textOf(d))}</textarea></div>
      ${foreign && c.reply_english ? `<p class="translate">Your reply means: ${esc(c.reply_english)}</p>` : ''}
    </div>
    <div class="msg-foot">${draftButtons(d)}</div></article>`;
}
function helloCard(d) {
  return `<article class="card msg ${d.status === 'approved' ? 'approved' : ''}"><div class="msg-head">${avatar(d.username)}
    <div class="grow"><button class="btn ghost small" style="padding:2px 0;font-weight:650" onclick="openPerson('${esc(d.username)}')">@${esc(d.username)}</button></div></div>
    <div class="msg-body">${d.note ? `<div class="note">${icon('alert')}<span>${esc(d.note)}</span></div>` : ''}
      <div class="draft"><label for="t${d.id}">Your hello</label><textarea id="t${d.id}" rows="1" ${d.status === 'sent' ? 'readonly' : ''} onchange="saveText(${d.id})">${esc(textOf(d))}</textarea></div></div>
    <div class="msg-foot">${draftButtons(d)}</div></article>`;
}
PAGES.replies = draftsPage('reply');
PAGES.hellos = draftsPage('hello');
async function act(id, action) {
  const t = $('#t' + id), pg = PAGE;
  await api(`/api/drafts/${id}`, {method: 'POST', body: JSON.stringify({action, text: t ? t.value : null})});
  delete EDITS[id];
  await refresh(); if (PAGE === pg && PAGES[pg].load) PAGES[pg].load();
}
async function saveText(id) {
  const t = $('#t' + id); await api(`/api/drafts/${id}`, {method: 'POST', body: JSON.stringify({action: 'save', text: t.value})});
  if (EDITS[id] === t.value) delete EDITS[id];
  toast('Saved');
}
async function approveAll(kind) {
  const n = kind === 'hello' ? S.counts.hellos_to_check : S.counts.replies_to_check - S.counts.replies_need_look;
  if (!n) return toast('Nothing ready to approve.');
  const extra = kind === 'reply' && S.counts.replies_need_look ? ` The ${S.counts.replies_need_look} that need a look stay for you.` : '';
  if (!await confirmBox({title: `Approve ${plural(n, kind === 'hello' ? 'hello' : 'reply', kind === 'hello' ? 'hellos' : 'replies')}?`, text: 'They go as they are when you press Send.' + extra, ok: 'Approve'})) return;
  const pg = PAGE, r = await post('/api/drafts/all/' + kind); toast(`Approved ${r.approved}. Press Send on Today when you're ready.`);
  if (PAGE === pg && PAGES[pg].load) PAGES[pg].load();
}

/* ============================================================== people */

        <button class="btn ghost" onclick="cancelUnfollows()">Cancel waiting ones</button>

async function askConvo(text) {
  ASKLOG.push({who: 'you', text}); const pending = {who: 'convo', pending: true}; ASKLOG.push(pending); PAGES.ask.render && PAGE === 'ask' && PAGES.ask.render();
  try {
    const r = await api('/api/ask', {method: 'POST', body: JSON.stringify({text})});
    Object.assign(pending, {pending: false, text: r.answer, meta: [r.actions && r.actions.length ? 'Did: ' + r.actions.join(', ') : '', r.cost ? cents(r.cost) : ''].filter(Boolean).join(' · ')});
    refresh(); return r;

}

  update(first) {
    const s = S.settings, ai = S.ai;
    const set = (id, v) => { const e = $('#' + id); if (e && (first || document.activeElement !== e)) e.value = v ?? ''; };
    set('writer', s.writer_model); set('eyes', s.eyes_model); set('budget', s.daily_ai_budget_usd);
    if (first) { set('dm', s.daily_messages); set('gm', s.message_gap_s); set('du', s.daily_unfollows); set('gu', s.unfollow_gap_s); set('rw', s.reply_window_days);
                 set('sendat', s.send_at); set('qf', s.quiet_from); set('qt', s.quiet_to); }
    const ov = $('#overnight'); if (ov) ov.checked = !!s.write_overnight; const tk = $('#tuck'); if (tk) tk.checked = !!s.tuck_window;
    const ez = $('#easy'); if (ez) ez.checked = prefs.get('easy', '') === '1'; const th = $('#theme'); if (th && first) th.value = prefs.get('theme', 'system');
    const e = ai.estimates[s.writer_model] || ai.estimates['claude-opus-5-5'];
    const wh = $('#writerhint'); if (wh) wh.textContent = `About ${cents(e.overnight)} a reply overnight, ${cents(e.now)} straight away.`;
    const sp = $('#spent'); if (sp) sp.textContent = `Spent so far: ${money(ai.spend_total)} in total, ${money(ai.spend_today)} today. Writing ${plural(ai.drafts, 'reply', 'replies')}: ${money(ai.drafts_usd)}. Using Instagram (${plural(ai.web_steps, 'look')}): ${money(ai.web_usd)}. Reports and Ask: ${money(ai.other_usd)}. Hellos use your own words and cost nothing to write.`;
    const v = $('#ver'); if (v) v.textContent = `Convo ${S.version} for @${S.you}${S.practice ? ' (practice)' : ''}`;
    const cb = $('#checkbtn'); if (cb) { cb.disabled = S.check.running; cb.innerHTML = S.check.running ? '<span class="typing"><b></b><b></b><b></b></span> Checking…' : icon('refresh') + ' Run the check'; }
    if (S.check.summary && !S.check.running) { const o = $('#checkout'); if (o && o.hidden) { api('/api/check').then(r => { if (r.report) { o.textContent = r.report.split('\n\n== ')[0]; o.hidden = false; } }); } }
  },
};
async function saveSetting(body) { await post('/api/settings', body); toast('Saved'); }
async function saveKey() { const k = $('#aikey').value.trim(); if (!k) return; await post('/api/settings', {ai_key: k}); $('#aikey').value = ''; toast('Key saved. AI is on.'); route(); }
async function saveSending() {
  const n = id => Number($('#' + id).value);
  await post('/api/settings', {daily_messages: n('dm'), message_gap_s: n('gm'), daily_unfollows: n('du'), unfollow_gap_s: n('gu'), reply_window_days: n('rw'),
    send_at: $('#sendat').value, quiet_from: $('#qf').value, quiet_to: $('#qt').value});
  toast('Saved');
}
async function signIn() { toast('Opening Instagram…'); await post('/api/instagram/login'); toast('Sign in in the Instagram window, then press Done.'); }
async function signInDone() { const r = await post('/api/instagram/login/done'); toast(r.signed_in ? 'Signed in to Instagram.' : 'Instagram still shows the sign-in page.', r.signed_in ? '' : 'bad'); }
async function runCheck() { $('#checkout').hidden = true; await post('/api/check'); toast('Running the check. It takes a couple of minutes.'); }
async function downloadCheck() { const r = await api('/api/download/report', {method: 'POST', body: '{}'}); const o = $('#dlout'); o.textContent = r.report; o.hidden = false; }
async function practice(real) { toast('Opening practice…'); const r = await post('/api/practice/start', {real_ai: real}); window.open(r.url, '_blank'); }
function textSize(d) { const v = Math.min(24, Math.max(14, parseInt(prefs.get('sz', '17')) + d)); prefs.set('sz', v); applyPrefs(); }
async function quitApp() {
  if (!await confirmBox({title: 'Quit Convo?', text: 'Sending and overnight checks stop until you open Convo again.', ok: 'Quit', danger: true})) return;
  await api('/api/quit', {method: 'POST', body: '{}'}); document.body.innerHTML = '<div style="text-align:center;margin-top:30vh;font:1.1rem system-ui">Convo has quit. You can close this window.</div>';
}

/* ============================================================== help */
PAGES.help = {
  mount(el) {
    const card = (ic, h, body) => `<div class="card"><h2 style="margin-bottom:8px">${icon(ic)} ${esc(h)}</h2>${body}</div>`;
    el.innerHTML = `<div class="grid-2">${[
      card('sun', 'Your day', `<p><b>Evening.</b> In Instagram: Accounts Center, Your information and permissions, Download your information. Pick Messages and Followers and following, format JSON, All time. When the email comes, save the file in Downloads and press <b>Load</b> on Today.</p>
        <p><b>Overnight.</b> Replies get written at half price.</p><p><b>Morning.</b> Check Replies and Hellos, approve, then <b>Send</b>. Or set a time in Settings and it sends by itself.</p>`),
      card('stop', 'Stop now', `<p>The red button at the top stops everything straight away: Claude stops at its next click, and nothing else goes until you press Send again. You can also type <b>stop</b> in Ask.</p>`),
      card('spark', 'Ask', `<p>Press ⌘K anywhere. Ask about people ("what did @maya say?"), get things done ("write a reply to @tom about sunday"), or control it ("send one", "pause").</p>
        <p>It only sends exact words you type, to people you name. Everything else waits for your approval.</p>`),
      card('send', 'How sending works', `<p>For each message, Claude looks at the Instagram page and clicks to the chat like you would. It checks it's the right person, that a hello goes into an empty chat, and that they haven't written again.</p>
        <p>Claude can't type. The app types your approved words, checks them letter by letter, presses Enter and checks the message appeared.</p>`),
      card('alert', 'When something goes wrong', `<p><b>Try again later:</b> Instagram didn't load. It waits 10 minutes.</p><p><b>Skip this person:</b> private, gone, or can't be messaged.</p>
        <p><b>Take a break:</b> Instagram said "try again later". 6 hours, then it carries on.</p><p><b>Stop and tell you:</b> sign in again, the AI key or credit, or three problems in a row. Run the self-check in Settings.</p>`),
      card('lock', 'Costs and privacy', `<p>About 1¢ to write a reply overnight with Opus, about 1¢ to send each message, hellos free to write. The daily limit in Settings keeps it to what you choose.</p>
        <p>Everything stays on this Mac. Only the chat being written to and the page Claude is looking at go to Anthropic.</p>`),
    ].join('')}</div>`;
  },
};

/* ============================================================== boot */
async function boot() {
  if (!TOKEN) return gate(true);
  try { await refresh(); } catch (e) { return gate(true); }
  gate(false); route();
  setInterval(() => refresh().catch(() => {}), 3000);
  setInterval(() => refreshLive().catch(() => {}), 2000);
}
boot();
</script>
